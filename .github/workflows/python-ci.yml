name: Python CI & Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-coverage:
    name: Run Tests and Check Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage pytest-cov flask

      - name: Run Python script from previous lab
        run: |
          python ./Coverage/app.py

      - name: Run Pytest and Integration tests
        run: |
          pytest Pytest/test_app.py -v
          pytest Integration/test_app.py -v

      - name: Generate Coverage Report (XML)
        run: |
          cd Coverage
          coverage erase
          coverage run -m pytest
          coverage report -m
          coverage xml

      - name: Upload Coverage XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Coverage/coverage.xml